services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rsa_postgres
    environment:
      POSTGRES_USER: rsa_admin
      POSTGRES_PASSWORD: rsa_dev_password
      POSTGRES_DB: rsa_sales
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsa_admin -d rsa_sales"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rsa_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rsa_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://rsa_admin:rsa_dev_password@postgres:5432/rsa_sales
      - REDIS_URL=redis://redis:6379/0
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=https://ark.ap-southeast.bytepluses.com/api/v3
      - LLM_MODEL_PRO=deepseek-v4-flash-ga-260731
      - LLM_MODEL_LITE=deepseek-v4-flash-ga-260731
      - EMBEDDING_MODEL=skylark-embedding-vision-250615
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - DEBUG=${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: ./backend
    container_name: rsa_celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://rsa_admin:rsa_dev_password@postgres:5432/rsa_sales
      - REDIS_URL=redis://redis:6379/0
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=https://ark.ap-southeast.bytepluses.com/api/v3
      - LLM_MODEL_PRO=deepseek-v4-flash-ga-260731
      - LLM_MODEL_LITE=deepseek-v4-flash-ga-260731
      - EMBEDDING_MODEL=skylark-embedding-vision-250615
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app worker --loglevel=info

  celery_beat:
    build: ./backend
    container_name: rsa_celery_beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://rsa_admin:rsa_dev_password@postgres:5432/rsa_sales
      - REDIS_URL=redis://redis:6379/0
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=https://ark.ap-southeast.bytepluses.com/api/v3
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:

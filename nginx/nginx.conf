events {
    worker_connections 1024;
}

http {
    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;

    # Client body size
    client_max_body_size 10M;

    # ──────────────────────────────────────────────────
    # NOTE: SSL/TLS is handled by CloudFlare tunnel in production.
    # CloudFlare terminates HTTPS → forwards HTTP to this nginx.
    # If deploying without CloudFlare, uncomment the HTTPS server
    # block below and provide SSL certificates.
    # ──────────────────────────────────────────────────

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # API proxy
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        location /health {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # Block /docs, /openapi.json, /redoc in production
        location /docs { return 404; }
        location /openapi.json { return 404; }
        location /redoc { return 404; }

        # Next.js frontend
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ──────────────────────────────────────────────────
    # HTTPS server — only needed if NOT using CloudFlare/ALB for SSL
    # ──────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: import check ──────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      contains(toJSON(github.event.commits[*].modified), 'backend/') ||
      contains(toJSON(github.event.commits[*].added), 'backend/') ||
      contains(toJSON(github.event.head_commit.modified), 'backend/') ||
      contains(toJSON(github.event.head_commit.added), 'backend/') ||
      github.event_name == 'push'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ vars.CI_POSTGRES_USER || 'rsa_admin' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_dummy_password' }}
          POSTGRES_DB: ${{ vars.CI_POSTGRES_DB || 'rsa_sales' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run import check
        env:
          DATABASE_URL: postgresql+asyncpg://${{ vars.CI_POSTGRES_USER || 'rsa_admin' }}:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_dummy_password' }}@localhost:5432/${{ vars.CI_POSTGRES_DB || 'rsa_sales' }}
          REDIS_URL: redis://localhost:6379/0
          ARK_API_KEY: dummy_key_for_ci
          DEBUG: "false"
        run: |
          cd backend
          python -c "from app.config import settings; print('Config OK')"
          python -c "from app.models import Account, Opportunity, Stage, User, Contact, Activity, Task, AgentLog; print('Models OK')"
          python -c "from app.main import app; print(f'Routes: {len(app.routes)}')"

  # ── Frontend: lint + build ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      contains(toJSON(github.event.commits[*].modified), 'frontend/') ||
      contains(toJSON(github.event.commits[*].added), 'frontend/') ||
      contains(toJSON(github.event.head_commit.modified), 'frontend/') ||
      contains(toJSON(github.event.head_commit.added), 'frontend/') ||
      github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build

  # ── Docker build check (main only) ─────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: winmap-backend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: winmap-frontend:latest
          load: true
          build-args: |
            BACKEND_URL=http://backend:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to server (main only) ───────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          timeout: 60s
          script: |
            cd /opt/winmap
            git pull origin main
            sudo docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build frontend backend celery_worker celery_beat
            sudo docker image prune -f
            echo "Deploy done at $(date)"

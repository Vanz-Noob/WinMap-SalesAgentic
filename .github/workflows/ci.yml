name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
 
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rsa_admin
          POSTGRES_PASSWORD: rsa_dev_password
          POSTGRES_DB: rsa_sales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa_admin -d rsa_sales"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run import check
        env:
          DATABASE_URL: postgresql+asyncpg://rsa_admin:rsa_dev_password@localhost:5432/rsa_sales
          REDIS_URL: redis://localhost:6379/0
          ARK_API_KEY: dummy_key_for_ci
          DEBUG: "false"
        run: |
          cd backend
          python -c "from app.config import settings; print('Config OK')"
          python -c "from app.models import Account, Opportunity, Stage, User, Contact, Activity, Task, AgentLog; print('Models OK')"
          python -c "from app.main import app; print(f'Routes: {len(app.routes)}')"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: latest
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: latest
          load: true
